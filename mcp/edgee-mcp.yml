gateway_capability:
  name: Tool Surface Reduction (virtual MCP)
  status: alpha
  source: https://www.edgee.ai/docs/features/token-compression
  description: 'Beyond serving tools, Edgee acts ON other MCP servers: the gateway presents the
    model a single virtual MCP server, classifies the user task, resolves which real MCP server is
    needed and returns the routing decision to the client, which then executes the real server. The
    IDE still exposes every MCP server and the agent still discovers tools through the standard MCP
    protocol; only the model sees the virtual MCP. Marked "New in V2, alpha" by Edgee.'
coverage:
  remote_tools: 4
  stdio_tools: 31
  live_introspection: gated
