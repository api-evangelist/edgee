  - {url: 'https://api.edgee.app/mcp', method: 'POST tools/list', http_status: 401, body: '{"error":{"type":"authentication_error","message":"Unauthorized"}}',
    fetched: '2026-08-17'}
  tools:
  - name: setSessionName
    description: Set a human-readable name for the running session (defaults to "Untitled Session").
    source: https://www.edgee.ai/docs/features/sessions
  - name: setSessionGitRepo
    description: 'Link the session to a git repo. Accepts owner/repo, a full URL, or an SSH URL; the
      host (GitHub, GitLab, Bitbucket, Azure DevOps) is detected from the identifier. GitHub repos
      require the Edgee GitHub App, otherwise silently ignored.'
    source: https://www.edgee.ai/docs/features/sessions
  - name: addSessionPullRequest
    description: Attach a PR URL or #number to the session. Append-only and de-duped.
    source: https://www.edgee.ai/docs/features/sessions
  - name: addSessionCommit
    description: Attach a commit SHA or commit URL to the session. Requires the session to have a
      repo set first, otherwise silently ignored. Append-only and de-duped.
    source: https://www.edgee.ai/docs/features/sessions
  note: All four tools require the session ID, which the Edgee CLI exposes to the agent
    automatically.
