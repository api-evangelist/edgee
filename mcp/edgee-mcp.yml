  package: https://www.npmjs.com/package/@edgee/mcp-server-edgee
  auth: api-key
  verified: probed
  note: 'TWO different MCP surfaces, from two different eras of the company, and they are not the
    same product.

    (1) REMOTE — Edgee injects a virtual MCP server into every coding-agent session routed through
    the gateway. The four session-metadata tools below are documented at
    https://www.edgee.ai/docs/features/sessions and the 2026-08-13 changelog adds an organization
    control to "disable automatic MCP injection", so the surface is real and provider-operated.
    Edgee does not publish the endpoint URL in its docs; https://api.edgee.app/mcp was established
    by PROBE on 2026-08-17 — GET returns 405 Method Not Allowed and POST returns HTTP 401
    {"error":{"type":"authentication_error","message":"Unauthorized"}}, while every other path on
    that host returns a 58-byte JSON 404, so the route exists and is auth-gated rather than a
    catch-all. tools/list and initialize both 401 anonymously, so the live inputSchemas could not be
    read; the tool list below comes from the docs (names + behaviour only).

    (2) LOCAL-STDIO — @edgee/mcp-server-edgee is a first-party npm package for the LEGACY
    edgee.cloud edge-platform API (organizations, projects, components, users). Last published
    2025-11-11, before the AI Gateway product existed. It is recorded because it is genuinely
    published and first-party, but it does not target the gateway.'
