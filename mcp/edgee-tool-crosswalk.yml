note: 'The headline finding of this crosswalk is that Edgee''s MCP surface and its OpenAPI surface do
  not overlap AT ALL. The published OpenAPI describes only the AI Gateway inference plane (7
  operations on https://edgee.io); the remote MCP tools operate on the session/observability plane of
  the Console API (https://api.edgee.app), which has no published OpenAPI; and the legacy stdio MCP
  server operates on the edgee.cloud edge-platform API, which is a third, retired surface. Coverage
  is therefore 0/7 rest ops bound and 0/35 tools bound — not because the mapping was missed, but
  because the three planes are genuinely disjoint. Live tools/list is auth-gated (HTTP 401), so tool
  input schemas could not be read and no confidence above "low" is claimed for any binding.'
