note: 'The machine-readable code registry, complementing errors/edgee-problem-types.yml (which is
  organised by HTTP status). Four of these codes — invalid_json, invalid_tokenizer, invalid_request
  and provider_error — appear only in the OpenAPI schema description and are NOT listed on the docs
  error page; the docs page is the thinner of the two sources.'
envelope_field: error.code
