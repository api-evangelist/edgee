  status: 400
  type: invalid_request_error
  meaning: The model ID format is invalid.
  example_message: "Invalid model ID: 'invalid-model'"
  action: Use the provider/model form, e.g. anthropic/claude-sonnet-4.5.
  documented: true
- code: model_not_found
  status: 400
  type: invalid_request_error
  meaning: The requested model does not exist or is not available.
  example_message: "Model 'openai/gpt-1' not found"
  action: Call GET /v1/models to list the models available to the key.
  documented: true
- code: provider_not_supported
  status: 400
  type: invalid_request_error
  meaning: The requested provider is not supported for the specified model.
  example_message: "Provider 'anthropic' is not supported for model 'openai/gpt-5.2'"
  action: Route the model to a provider that serves it.
  documented: true
- code: streaming_not_supported
  status: 400
  type: invalid_request_error
  meaning: Streaming on the Messages API is only supported when the model uses the Anthropic
