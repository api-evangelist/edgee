- aid: edgee-ai-gateway
  name: Edgee AI Gateway API
  description: 'OpenAI-compatible AI Gateway API. One API for any model and any provider: chat completions,
    Anthropic-format messages, OpenAI Responses, a live model catalog, token counting, and a standalone
    token-compression endpoint. Authenticated with a bearer API key (or an Anthropic-style x-api-key header).'
