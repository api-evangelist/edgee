aid: edgee
name: Edgee
description: 'Edgee is a French edge-native AI Gateway that sits between coding agents and LLM providers,
  intercepting, routing, compressing, metering and securing every request. Its OpenAI-compatible gateway
  API at edgee.io exposes chat completions, an Anthropic Messages endpoint, an OpenAI Responses endpoint,
  a model catalog of 230+ models across providers, token counting and a standalone compression endpoint,
  while a separate Console API at api.edgee.app handles organization management, gateway key management,
  BYOK provider keys and usage/cost export. A Rust CLI launches Claude Code, Codex, OpenCode, Cursor and
  VS Code Copilot through the gateway, and official TypeScript, Python, Go and Rust SDKs wrap the same
  surface. Edgee previously operated as an edge component runtime and data-collection platform at
  edgee.cloud; that documentation now redirects to the AI Gateway product at edgee.ai.'
